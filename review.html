<body>

    <!-- แถบเมนูหลัก (แยกออกมาอยู่นอก top-controls เพื่อไม่ให้ซ้อนทับกัน) -->

            </a>
            <a href="contact.html">

                <span class="lang-ko">문의하기</span>
                <span class="lang-en">CONTACT</span>
            </a>
        </div>

    <main class="main-card">
        <h2>🎰 รีวิวแล้วส่งอวตารลงโหลกัน!</h2>
        
        <div class="form-box">
            <!-- แสดงพรีวิวหน้าตาที่เลือกอยู่ปัจจุบัน -->

                <div class="avatar-preview-circle">
                    <img id="currentAvatarPreview" src="images/char1.png" style="width:100%; height:100%; object-fit:contain;">
                </div>
            </div>

            <!-- 🧱 ตารางปุ่มเลือกหน้าวาดเอง (สไตล์ตาราง Grid แบบภาพที่คุณส่งมา) -->
            <div class="customizer-panel">
                <span class="section-title">👤 คลิกเลือกใบหน้าของคุณ (Select Face)</span>
                <div class="grid-options">
                    <!-- หน้าที่ 1 -->
                    <button class="img-opt-btn active" onclick="selectAvatar('cartoon/1.jpeg', this)">
                        <img src="cartoon/1.jpeg">
                    </button>
                    <!-- หน้าที่ 2 -->
                    <button class="img-opt-btn" onclick="selectAvatar('cartoon/2.jpeg', this)">
                        <img src="cartoon/2.jpeg">
                    </button>
                    <!-- หน้าที่ 3 -->
                    <button class="img-opt-btn" onclick="selectAvatar('cartoon/3.jpeg', this)">
                        <img src="cartoon/3.jpeg">
                    </button>
                    <!-- หน้าที่ 4 -->
                    <button class="img-opt-btn" onclick="selectAvatar('cartoon/4.jpeg', this)">
                        <img src="cartoon/4.jpeg">
                    </button>
                    <button class="img-opt-btn" onclick="selectAvatar('cartoon/5.jpeg', this)">
                        <img src="cartoon/5.jpeg">
                    </button>
                    <button class="img-opt-btn" onclick="selectAvatar('cartoon/6.jpeg', this)">
                        <img src="cartoon/6.jpeg">
                    </button>
                    <button class="img-opt-btn" onclick="selectAvatar('cartoon/7.jpeg', this)">
                        <img src="cartoon/7.jpeg">
                    </button>
                    <button class="img-opt-btn" onclick="selectAvatar('cartoon/8.jpeg', this)">
                        <img src="cartoon/8.jpeg">
                    </button>
                    <button class="img-opt-btn" onclick="selectAvatar('cartoon/9.jpeg', this)">
                        <img src="cartoon/9.jpeg">
                    </button>
                    <button class="img-opt-btn" onclick="selectAvatar('cartoon/11.jpeg', this)">
                        <img src="cartoon/11.jpeg">
                    </button>
                    <button class="img-opt-btn" onclick="selectAvatar('cartoon/12.jpeg', this)">
                        <img src="cartoon/12.jpeg">
                    </button>
                    <button class="img-opt-btn" onclick="selectAvatar('cartoon/13.jpeg', this)">
                        <img src="cartoon/13.jpeg">
                    </button>
                    <button class="img-opt-btn" onclick="selectAvatar('cartoon/14.jpeg', this)">
                        <img src="cartoon/14.jpeg">
                    </button>
                    <button class="img-opt-btn" onclick="selectAvatar('cartoon/15.jpeg', this)">
                        <img src="cartoon/15.jpeg">
                    </button>
                    <button class="img-opt-btn" onclick="selectAvatar('cartoon/16.jpeg', this)">
                        <img src="cartoon/16.jpeg">
                    </button>
                    <button class="img-opt-btn" onclick="selectAvatar('cartoon/17.jpeg', this)">
                        <img src="cartoon/17.jpeg">
                    </button>
                    <button class="img-opt-btn" onclick="selectAvatar('cartoon/18.jpeg', this)">
                        <img src="cartoon/18.jpeg">
                    </button>
                    <button class="img-opt-btn" onclick="selectAvatar('cartoon/19.jpeg', this)">
                        <img src="cartoon/19.jpeg">
                    </button>
                    <!-- (ถ้ามีหน้าเพิ่ม สามารถก๊อปปี้ปุ่มเพิ่มตรงนี้ได้เลยครับ) -->
                </div>
            </div>

            <!-- ช่องเขียนรีวิว -->
            <textarea id="reviewInput" placeholder="เขียนรีวิวของคุณที่นี่..."></textarea><br>
            <button class="action-btn" onclick="addReview()">โยนลงโหลกาชาปอง 🎁</button>
        </div>

        <!-- โหลแก้ว Matter.js -->
        <div id="jar"></div>
    </main>

    <script>
        // --- 1. ตัวแปรและค่าเริ่มต้นระบบฟิสิกส์ ---
        let engine, runner, world;
        let selectedAvatarSrc = 'cartoon/1.jpeg'; // ค่าเริ่มต้นหน้าแรก
        const scriptURL = 'https://script.google.com/macros/s/AKfycbxTr_IGcj32pFWK3oZW7sazgy600VaIbbWD5lqRcwAt7QYoEyBEPSTh4N9r2IrzM845VA/exec'; 

        // --- 2. ฟังก์ชันเลือกรูปอวตาร ---
        function selectAvatar(imagePath, btnElement) {
            selectedAvatarSrc = imagePath;
            document.getElementById('currentAvatarPreview').src = imagePath;
            
            // ไฮไลต์สีปุ่มที่เลือก
            const buttons = btnElement.parentNode.querySelectorAll('.img-opt-btn');
            buttons.forEach(btn => btn.classList.remove('active'));
            btnElement.classList.add('active');
        }

        // --- 3. เริ่มต้น Matter.js เมื่อโหลดหน้าเว็บเสร็จ ---
        window.addEventListener('DOMContentLoaded', () => {
            const { Engine, Runner, Bodies, Composite } = Matter;

            engine = Engine.create();
            world = engine.world;

            const jarElement = document.getElementById('jar');
            if (jarElement) {
                const width = jarElement.clientWidth || 300;
                const height = jarElement.clientHeight || 400;

                const ground = Bodies.rectangle(width / 2, height + 25, width, 50, { isStatic: true });
                const leftWall = Bodies.rectangle(-25, height / 2, 50, height, { isStatic: true });
                const rightWall = Bodies.rectangle(width + 25, height / 2, 50, height, { isStatic: true });

                Composite.add(world, [ground, leftWall, rightWall]);

                runner = Runner.create();
                Runner.run(runner, engine);

                loadExistingReviews();
            }

            // ระบบสลับธีมและภาษา
            initThemeAndLang();
        });

        // --- 4. โหลดรีวิวเดิมจาก Google Sheets ---
        function loadExistingReviews() {
            fetch(scriptURL)
                .then(response => response.json())
                .then(reviews => {
                    if (Array.isArray(reviews)) {
                        reviews.forEach((item, index) => {
                            // รองรับทั้งแบบข้อมูลเก่า (ข้อความอย่างเดียว) หรือแบบใหม่ (object ถ้ามี)
                            const text = typeof item === 'object' ? item.review : item;
                            const avatar = typeof item === 'object' && item.avatar ? item.avatar : 'cartoon/1.jpeg';
                            
                            setTimeout(() => {
                                createPhysicsBall(text, avatar);
                            }, index * 150);
                        });
                    }
                })
                .catch(error => console.log('ยังไม่มีข้อมูลรีวิว หรือ CORS policy โหลดไม่ได้:', error));
        }

        // --- 5. สร้างลูกบอลฟิสิกส์พร้อมรูปภาพอวตาร ---
        function createPhysicsBall(reviewText, avatarImgSrc) {
            const { Bodies, Composite } = Matter;
            const jarElement = document.getElementById('jar');
            if (!jarElement) return;
            
            const width = jarElement.clientWidth || 300;
            const radius = 25; 
            const startX = Math.random() * (width - 60) + 30;

            const ball = Bodies.circle(startX, -50, radius, {
                restitution: 0.5,
                friction: 0.05,
                render: {
                    sprite: {
                        texture: avatarImgSrc,
                        xScale: (radius * 2) / 200, 
                        yScale: (radius * 2) / 200
                    }
                }
            });

            // สร้าง DOM Element ครอบลูกบอลเพื่อให้กดดูข้อความรีวิวได้
            const ballElement = document.createElement('div');
            ballElement.className = 'gacha-ball-avatar';
            ballElement.style.width = `${radius * 2}px`;
            ballElement.style.height = `${radius * 2}px`;
            ballElement.style.position = 'absolute';
            ballElement.style.borderRadius = '50%';
            ballElement.style.overflow = 'hidden';
            ballElement.style.cursor = 'pointer';
            ballElement.style.border = '2px solid #fff';
            ballElement.style.boxShadow = '0 4px 6px rgba(0,0,0,0.1)';

            const img = document.createElement('img');
            img.src = avatarImgSrc;
            img.style.width = '100%';
            img.style.height = '100%';
            img.style.objectFit = 'cover';
            ballElement.appendChild(img);

            // คลิกเพื่อดูรีวิว
            ballElement.onclick = function() {
                alert(`💬 รีวิว: ${reviewText}`);
            };

            jarElement.appendChild(ballElement);
            Composite.add(world, ball);

            // อัปเดตตำแหน่งบอลตามฟิสิกส์
            function updatePosition() {
                const { x, y } = ball.position;
                ballElement.style.left = `${x - radius}px`;
                ballElement.style.top = `${y - radius}px`;
                requestAnimationFrame(updatePosition);
            }
            updatePosition();
        }

        // --- 6. กดปุ่มส่งรีวิว ---
        function addReview() {
            const input = document.getElementById('reviewInput');
            const text = input.value.trim();

            if (!text) {
                alert('กรุณาเขียนรีวิวก่อนน้าาา! 📝');
                return;
            }

            // ส่งข้อมูลไป Google Sheets
            fetch(scriptURL, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ review: text, avatar: selectedAvatarSrc })
            }).catch(error => console.error('Error!', error.message));

            // สร้างลูกบอลตกลงโหลทันที
            createPhysicsBall(text, selectedAvatarSrc);

            // รีเซ็ตช่องพิมพ์
            input.value = '';
            alert('โยนรีวิวลงโหลสำเร็จแล้ว! 🎉');
        }

        // --- 7. จัดการระบบธีมและภาษา ---
        function initThemeAndLang() {
            const themeToggleBtn = document.getElementById('themeToggle');
            const themeIcon = document.getElementById('themeIcon');
            const body = document.body;
            let particleInterval = null;

            function applyTheme(theme) {
                if (theme === 'dark') {
                    body.classList.add('dark-theme');
                    if(themeIcon) { themeIcon.className = 'fa-solid fa-sun'; themeIcon.style.color = '#f59e0b'; }
                    startFallingEffect('snow');
                } else {
                    body.classList.remove('dark-theme');
                    if(themeIcon) { themeIcon.className = 'fa-solid fa-moon'; themeIcon.style.color = '#94a3b8'; }
                    startFallingEffect('flower');
                }
                localStorage.setItem('selectedTheme', theme);
            }

            function startFallingEffect(type) {
                if (particleInterval) clearInterval(particleInterval);
                document.querySelectorAll('.falling-particle').forEach(el => el.remove());
                const items = type === 'snow' ? ['❄', '✧', '•'] : ['🍂'];
                const colors = type === 'snow' ? ['#ffffff', '#e2e8f0', '#93c5fd'] : ['#f43f5e', '#fda4af', '#f472b6'];
                particleInterval = setInterval(() => {
                    const particle = document.createElement('div');
                    particle.className = 'falling-particle';
                    const startLeft = Math.random() * window.innerWidth;
                    const duration = Math.random() * 4 + 4;
                    const fontSize = Math.random() * 12 + 10;
                    particle.innerText = items[Math.floor(Math.random() * items.length)];
                    particle.style.color = colors[Math.floor(Math.random() * colors.length)];
                    particle.style.left = startLeft + 'px';
                    particle.style.fontSize = fontSize + 'px';
                    particle.style.animationDuration = duration + 's';
                    document.body.appendChild(particle);
                    setTimeout(() => { particle.remove(); }, duration * 1000);
                }, 300);
            }

            if(themeToggleBtn) {
                themeToggleBtn.addEventListener('click', function() {
                    const currentTheme = body.classList.contains('dark-theme') ? 'light' : 'dark';
                    applyTheme(currentTheme);
                });
            }
            const savedTheme = localStorage.getItem('selectedTheme') || 'dark';
            applyTheme(savedTheme);

            const langOptions = document.querySelectorAll('.lang-option');
            function changeLanguage(lang) {
                localStorage.setItem('selectedLanguage', lang);
                document.querySelectorAll('.lang-th, .lang-ko, .lang-en').forEach(el => el.classList.add('lang-hidden'));
                document.querySelectorAll('.lang-' + lang).forEach(el => el.classList.remove('lang-hidden'));
            }
            langOptions.forEach(option => {
                option.addEventListener('click', function() {
                    changeLanguage(this.getAttribute('data-lang'));
                });
            });
            changeLanguage(localStorage.getItem('selectedLanguage') || 'th');
        }
    </script>    
</body>
