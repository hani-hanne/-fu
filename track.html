<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ติดตามสถานะพัสดุ</title>
    <style>
        body { font-family: sans-serif; padding: 20px; max-width: 500px; margin: 0 auto; }
        .search-box { display: flex; gap: 10px; margin-bottom: 20px; }
        input { flex: 1; padding: 10px; font-size: 16px; border: 1px solid #ccc; border-radius: 5px; }
        button { padding: 10px 20px; font-size: 16px; background-color: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer; }
        .result-card { border: 1px solid #ddd; padding: 15px; border-radius: 8px; background: #f9f9f9; display: none; margin-top: 15px; }
        .error { color: red; margin-top: 10px; }
    </style>
</head>
<body>

    <h2>ติดตามสถานะพัสดุ</h2>
    
    <div class="search-box">
        <input type="text" id="orderIdInput" placeholder="กรอกรหัสคำสั่งซื้อ (Order ID)">
        <button onclick="checkTracking()">ค้นหา</button>
    </div>

    <div id="statusMessage"></div>
    
    <div id="resultCard" class="result-card">
        <h3>ผลการค้นหาคำสั่งซื้อ: <span id="resOrderId"></span></h3>
        <p><strong>สถานะ:</strong> <span id="resStatus"></span></p>
        <p><strong>เลขพัสดุ (Tracking):</strong> <span id="resTracking"></span></p>
    </div>

    <script>
        async function checkTracking() {
            const orderId = document.getElementById('orderIdInput').value.trim();
            const statusMessage = document.getElementById('statusMessage');
            const resultCard = document.getElementById('resultCard');

            statusMessage.innerHTML = '';
            resultCard.style.display = 'none';

            if (!orderId) {
                statusMessage.innerHTML = '<p class="error">กรุณากรอกรหัสคำสั่งซื้อก่อนค้นหา</p>';
                return;
            }

            statusMessage.innerHTML = '<p>กำลังค้นหาข้อมูล...</p>';

            // ** นำ URL ของ Google Apps Script Web App มาใส่ตรงนี้ **
            const WEB_APP_URL = "ใส่_URL_Google_Apps_Script_ที่นี่"; 

            try {
                const response = await fetch(`${WEB_APP_URL}?id=${encodeURIComponent(orderId)}`);
                const data = await response.json();

                if (data.result === "found") {
                    statusMessage.innerHTML = '';
                    document.getElementById('resOrderId').textContent = data.orderId;
                    document.getElementById('resStatus').textContent = data.status;
                    document.getElementById('resTracking').textContent = data.tracking;
                    resultCard.style.display = 'block';
                } else {
                    statusMessage.innerHTML = '<p class="error">❌ ไม่พบข้อมูลคำสั่งซื้อนี้ในระบบ</p>';
                }
            } catch (error) {
                console.error(error);
                statusMessage.innerHTML = '<p class="error">❌ เกิดข้อผิดพลาดในการเชื่อมต่อเซิร์ฟเวอร์</p>';
            }
        }
    </script>

</body>
</html>
