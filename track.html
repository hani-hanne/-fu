                <a href="track.html" class="active">
                    <span class="lang-th">สถานะ</span>

                </a>
                <div class="top-controls">
        <button id="themeToggle" class="theme-toggle-btn">
            <i id="themeIcon" class="fa-solid fa-sun"></i>
        </button>

        <!---<div class="lang-selector">
            <button class="lang-btn">
                <i class="fa-solid fa-globe"></i>
                <span class="lang-th">TH</span>
                <span class="lang-ko" style="display:none;">KO</span>

            <div class="lang-dropdown">

        </div>--->

        </header>

        <main class="main-card">
            <h2 class="section-title">
                <span class="lang-th">ตรวจสอบหาเลขสั่งซื้อ เลขพัสดุ</span>
                <span class="lang-ko">주문 상태 조회</span>
                <span class="lang-en">Order Tracking</span>
            </h2>
            
            <div class="tracking-container" style="max-width: 500px; margin: 0 auto; text-align: center;">
                <input type="text" id="orderId" placeholder="กรอกหมายเลขคำสั่งซื้อ / Order ID" style="width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #ccc; margin-bottom: 15px;">
                <button onclick="trackOrder()" class="btn btn-action" style="width: 100%;">
                    <span class="lang-th">ตรวจสอบ</span><span class="lang-ko">조회하기</span><span class="lang-en">TRACK</span>
                </button>
                
                <div id="result" style="margin-top: 20px; padding: 20px; border-radius: 10px; display: none;"></div>
            </div>
        </main>
    </div>

    <script>
        //te//
        document.addEventListener("DOMContentLoaded", function() {
            const themeToggleBtn = document.getElementById('themeToggle');
            const themeIcon = document.getElementById('themeIcon');
            const body = document.body;
            let particleInterval = null;

            function applyTheme(theme) {
                if (theme === 'dark') {
                    body.classList.add('dark-theme');
                    if(themeIcon) { themeIcon.className = 'fa-solid fa-sun'; themeIcon.style.color = '#f59e0b'; }
                    startFallingEffect('snow');
                } else {
                    body.classList.remove('dark-theme');
                    if(themeIcon) { themeIcon.className = 'fa-solid fa-cloud'; themeIcon.style.color = '#94a3b8'; }
                    startFallingEffect('flower');
                }
                localStorage.setItem('selectedTheme', theme);
            }

            function startFallingEffect(type) {
                if (particleInterval) clearInterval(particleInterval);
                document.querySelectorAll('.falling-particle').forEach(el => el.remove());
                const items = type === 'snow' ? ['❄', '✧', '•'] : ['🍂'];
                const colors = type === 'snow' ? ['#ffffff', '#e2e8f0', '#93c5fd'] : ['#f43f5e', '#fda4af', '#f472b6'];
                particleInterval = setInterval(() => {
                    const particle = document.createElement('div');
                    particle.className = 'falling-particle';
                    const startLeft = Math.random() * window.innerWidth;
                    const duration = Math.random() * 4 + 4;
                    const fontSize = Math.random() * 12 + 10;
                    particle.innerText = items[Math.floor(Math.random() * items.length)];
                    particle.style.color = colors[Math.floor(Math.random() * colors.length)];
                    particle.style.left = startLeft + 'px';
                    particle.style.fontSize = fontSize + 'px';
                    particle.style.animationDuration = duration + 's';
                    document.body.appendChild(particle);
                    setTimeout(() => { particle.remove(); }, duration * 1000);
                }, 300);
            }

            if(themeToggleBtn) {
                themeToggleBtn.addEventListener('click', function() {
                    const currentTheme = body.classList.contains('dark-theme') ? 'light' : 'dark';
                    applyTheme(currentTheme);
                });
            }
            applyTheme(localStorage.getItem('selectedTheme') || 'light');

            const langOptions = document.querySelectorAll('.lang-option');
            function changeLanguage(lang) {
                localStorage.setItem('selectedLanguage', lang);
                document.querySelectorAll('.lang-th, .lang-ko, .lang-en').forEach(el => el.classList.add('lang-hidden'));
                document.querySelectorAll('.lang-' + lang).forEach(el => el.classList.remove('lang-hidden'));
            }
            langOptions.forEach(option => {
                option.addEventListener('click', function() {
                    changeLanguage(this.getAttribute('data-lang'));
                });
            });
            changeLanguage(localStorage.getItem('selectedLanguage') || 'th');
        });
        window.addEventListener("load", function() {
            setTimeout(function() {
                document.getElementById("loading-screen").style.display = "none";
                document.getElementById("main-content").style.display = "block";
            }, 3000); // 3000 คือ 3 วินาที
        });
    
        async function trackOrder() {
            const searchId = document.getElementById('orderId').value.trim();
            const resultDiv = document.getElementById('result');
            
            if (!searchId) {
                alert('กรุณากรอกหมายเลขคำสั่งซื้อก่อนค้นหาค่ะ');
                return;
            }
            
            resultDiv.style.display = "block";
            resultDiv.style.backgroundColor = "#fef08a";
            resultDiv.innerHTML = "<h3>กำลังค้นหาข้อมูล...</h3>";

            // 3 ลิงก์ Web App ของคุณ old splittle little
            const WEB_APP_URLS = [
                "https://script.google.com/macros/s/AKfycbxY9gW4Mokk98Moi_Jhn9bZ7bAPy2qljA_lc2ejBegiWL1Mr5h72gn9dER8yq5ejxSj/exec",
                "https://script.google.com/macros/s/AKfycbzHupNdz8W_NYCfwQShX_bmXDrLvfnRMZmDBWXSmTqDbqMA7yutOngHzhquWRx6heUn/exec",
                "https://script.google.com/macros/s/AKfycbzLDTvaWbF-3fGFGj_M7QUPFbo_Avz4YvwsXVKCpLzNx9FUXS10xqF-G1QNoKT6DRRibg/exec"
            ];

            let foundData = null;

            try {
                // วนลูปเช็คทีละลิงก์
                for (let i = 0; i < WEB_APP_URLS.length; i++) {
                    const response = await fetch(WEB_APP_URLS[i]);
                    const rows = await response.json(); // ได้ข้อมูลมาเป็นตาราง (Array) ทั้งหมด
                    
                    // ค้นหาแถวที่ OrderId ตรงกับที่ลูกค้ากรอก (ไม่สนตัวพิมพ์เล็ก-ใหญ่)
                    const matched = rows.find(item => 
                        item.OrderId && String(item.OrderId).trim().toLowerCase() === searchId.toLowerCase()
                    );
                    
                    if (matched) {
                        foundData = matched;
                        break; // เจอแล้วหยุดหาเลย
                    }
                }

                resultDiv.style.display = "block";
                if (foundData) {
                    resultDiv.style.backgroundColor = "#dcfce7";
                    
                    // 📌 แก้ไขตรงนี้ให้ใช้ foundData แทน "เลขพัสดุ"
                    const trackingNo = foundData.TrackingT || foundData.Tracking || 'ยังไม่ระบุเลขพัสดุ';
                    const kerryLink = trackingNo !== 'ยังไม่ระบุเลขพัสดุ' 
                        ? `https://th.kex-express.com/th/track-parcel` 
                        : '#';

                    resultDiv.innerHTML = `
                        <h3>✅ พบข้อมูลคำสั่งซื้อ!</h3>
                        <p>ชื่อผู้รับ: <b>${foundData.Name || '-'}</b></p>
                        <p>หมายเลขคำสั่งซื้อ: <b>${foundData.OrderId || '-'}</b></p>
                        <p>เบอร์โทรศัพท์: <b>${foundData.Phone || '-'}</b></p>
                        <hr style="border:0; border-top:1px solid #cbd5e1; margin:10px 0;">
                        <p>📦 <strong>เลขพัสดุ Kerry:</strong> <span style="color: #d97706; font-size: 18px;"><b>${trackingNo}</b></span></p>
                        <div style="margin-top: 15px;">
                            ${trackingNo !== 'ยังไม่ระบุเลขพัสดุ' ? `
                                <a href="${kerryLink}" target="_blank" class="btn" style="background-color: #2563eb; color: white; padding: 10px 15px; border-radius: 5px; text-decoration: none; display: inline-block;">
                                    <i class="fa-solid fa-truck-fast"></i> คลิกเพื่อเช็คพัสดุกับ Kerry
                                </a>
                            ` : `
                                <p style="color: #64748b; font-size: 14px;">(กำลังเตรียมจัดส่ง หรือยังไม่,อัปเดตเลขพัสดุ)</p>
                            `}
                        </div>
                    `;
                } else {
                    resultDiv.style.backgroundColor = "#fee2e2";
                    resultDiv.innerHTML = "<h3>❌ ไม่พบข้อมูล</h3><p>กรุณาตรวจสอบหมายเลขคำสั่งซื้อใหม่อีกครั้ง</p>";
                }

            } catch (err) {
                console.error(err);
                resultDiv.style.display = "block";
                resultDiv.style.backgroundColor = "#fee2e2";
                resultDiv.innerHTML = "<h3>⚠️ เกิดข้อผิดพลาด</h3><p>ไม่สามารถเชื่อมต่อกับฐานข้อมูลได้ โปรดลองใหม่อีกครั้ง</p>";
            }
        }

        // ระบบสลับภาษา (คัดลอกมาจาก index.html เดิมของคุณ)
        const savedLang = localStorage.getItem('selectedLanguage') || 'th';
        document.querySelectorAll('.lang-th, .lang-ko, .lang-en').forEach(el => el.classList.add('lang-hidden'));
        document.querySelectorAll('.lang-' + savedLang).forEach(el => el.classList.remove('lang-hidden'));
        window.addEventListener("load", function() {
            setTimeout(function() {
                document.getElementById("loading-screen").style.display = "none";
                document.getElementById("main-content").style.display = "block";
            }, 2000); // 3000 คือ 3 วินาที
        });
    </script>
</body>
