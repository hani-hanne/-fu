<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>ชำระเงิน - Mona Portfolio</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="web-container">
        <header class="navbar">
            <div class="trols">
                <button id="themeToggle" class="theme-toggle-btn" type="button">
                    <i id="themeIcon" class="fa-solid fa-sun"></i>
                </button>
            </div>
        </header>
        
        <main class="payment-page" style="padding: 20px 0; text-align: center;">
            <div class="timer-box" style="background: rgba(255, 71, 87, 0.1); padding: 10px; border-radius: 10px; margin-bottom: 15px; color: #ff4757; font-weight: bold;">
                <i class="fa-solid fa-clock"></i> กรุณาโอนเงินภายใน: <span id="countdown-timer" style="font-size: 18px;">05:00</span> นาที
            </div>
            <!-- ฟอร์มสำหรับตรวจสอบการแนบสลิป -->
            <form id="paymentForm" onsubmit="finishOrder(event)">
                <div class="qr-box">
                    <h2>สแกนเพื่อชำระเงิน</h2>
                    <p>ยอดที่ต้องชำระ: <span id="final-amount">0</span> บาท</p>
                    <!-- เปลี่ยนมาใช้โฟลเดอร์ img เพื่อป้องกันปัญหาหาภาพไม่เจอ -->
                    <img id="qrImage" src="payment/1.jpg" alt="QR Code" class="qr-img" style="max-width: 250px; display: block; margin: 0 auto;">
                    <p style="color: red; margin-top: 10px;">*แนบสลิปการโอนเงิน แล้วกดปุ่มด้านล่างเพื่อยืนยัน*</p>
                    <div class="form-group" style="margin: 15px 0;">
                        <label>แนบสลิปการโอนเงิน: </label>
                        <input type="file" id="slipInput" accept="image/*" required>
                    </div>
                    <br>
                    <button type="submit" class="btn btn-action-submit">สั่งซื้อสำเร็จ</button>
                </div>
            </form>
        </main>
    </div>

    <!-- โค้ด JavaScript ควบคุมหน้าชำระเงิน -->
    <script>
        // โค้ดดึงยอดเงินจากหน้าสั่งซื้อ
        const savedTotal = sessionStorage.getItem('orderTotal');
        
        if (savedTotal && document.getElementById('final-amount')) {
            document.getElementById('final-amount').innerText = savedTotal;
            
            const totalAmount = parseInt(savedTotal);
            const qrImage = document.getElementById('qrImage');

            // เงื่อนไขเปลี่ยน QR Code ตามยอดเงิน
            if (totalAmount === 790) {
                qrImage.src = 'payment/1.jpg'; 
            } else if (totalAmount === 1580) {
                qrImage.src = 'payment/p2.jpg';
            } else if (totalAmount === 2370) {
                qrImage.src = 'payment/S__41599020.jpg';
            } else {
                qrImage.src = 'payment/1.jpg';
            }
        }
        
        // ฟังก์ชันเมื่อกดปุ่มสั่งซื้อสำเร็จ
        async function finishOrder(event) {
            event.preventDefault(); // ป้องกันการรีเฟรชหน้า
            
            const slipInput = document.getElementById('slipInput');
            if (slipInput.files.length === 0) {
                alert('กรุณาแนบสลิปการโอนเงินก่อนกดยืนยันค่ะ');
                return;
            }

            const file = slipInput.files[0];
            const totalAmount = document.getElementById('final-amount').innerText;

            // ดึงจำนวนเล่มที่บันทึกไว้ หรือคำนวณสำรองจากยอดเงิน
            let qty = parseInt(sessionStorage.getItem('orderQty')) || 1;
            const parsedTotal = parseInt(totalAmount);
            if (parsedTotal === 1580) qty = 2;
            else if (parsedTotal === 2370) qty = 3;

            // แสดงสถานะกำลังโหลด
            const submitBtn = event.target.querySelector('button[type="submit"]');
            const originalText = submitBtn.innerText;
            submitBtn.innerText = 'กำลังบันทึกข้อมูล...';
            submitBtn.disabled = true;

            try {
                // แปลงไฟล์รูปภาพเป็น Base64
                const base64Data = await toBase64(file);

                // **ดึงข้อมูลทั้งหมดจาก sessionStorage ให้ครบถ้วนตรงกับที่ Google Apps Script รอรับ**
                const payload = {
                    name: sessionStorage.getItem('orderName') || '-',
                    email: sessionStorage.getItem('orderEmail') || '-',
                    phone: sessionStorage.getItem('orderPhone') || '-',
                    qty: qty,
                    province: sessionStorage.getItem('orderProvince') || '-',
                    district: sessionStorage.getItem('orderDistrict') || '-',
                    zipcode: sessionStorage.getItem('orderZipcode') || '-',
                    address: sessionStorage.getItem('orderAddress') || '-',
                    total: totalAmount,
                    fileName: file.name,
                    mimeType: file.type,
                    fileData: base64Data
                };

                const scriptURL = 'https://script.google.com/macros/s/AKfycbx24d53TZpwyFbkCWqGaH2nZvLIHYtYnrtPQLek8tcf2YIjt9jMKKyaYek_7fzkvMTY/exec';
                await fetch(scriptURL, {
                    method: 'POST',
                     
                    headers: {
                        'Content-Type': 'text/plain;charset=utf-8',
                    },
                    body: JSON.stringify(payload)
                });

                // ล้างข้อมูลเวลาและ Session จากนั้นพาไปหน้าสำเร็จ
                localStorage.removeItem('paymentTimer');
                sessionStorage.clear();
                window.location.href = 'final.html';

            } catch (error) {
                console.error('Error!', error.message);
                alert('เกิดข้อผิดพลาดในการส่งข้อมูล กรุณาลองใหม่อีกครั้ง');
                submitBtn.innerText = originalText;
                submitBtn.disabled = false;
            }
        }
          
        // ฟังก์ชันช่วยเหลือสำหรับแปลงไฟล์เป็น Base64
        const toBase64 = file => new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = () => resolve(reader.result.split(',')[1]); 
            reader.onerror = error => reject(error);
        });
        
        // ควบคุม Dark/Light Mode
        document.addEventListener("DOMContentLoaded", function() {
            const themeToggleBtn = document.getElementById('themeToggle');
            const themeIcon = document.getElementById('themeIcon');
            const body = document.body;

            function applyTheme(theme) {
                if (theme === 'dark') {
                    body.classList.add('dark-theme');
                    if(themeIcon) { themeIcon.className = 'fa-solid fa-sun'; themeIcon.style.color = '#f59e0b'; }
                } else {
                    body.classList.remove('dark-theme');
                    if(themeIcon) { themeIcon.className = 'fa-solid fa-moon'; themeIcon.style.color = '#94a3b8'; }
                }
                localStorage.setItem('selectedTheme', theme);
            }

            if(themeToggleBtn) {
                themeToggleBtn.addEventListener('click', function() {
                    const currentTheme = body.classList.contains('dark-theme') ? 'light' : 'dark';
                    applyTheme(currentTheme);
                });
            }
            const savedTheme = localStorage.getItem('selectedTheme') || 'dark';
            applyTheme(savedTheme);
        });

        // ตั้งเวลา 5 นาที (300 วินาที)
        let timeLeft = parseInt(localStorage.getItem('paymentTimer')) || 300;
        const timerElement = document.getElementById('countdown-timer');

        const countdownInterval = setInterval(() => {
            let minutes = Math.floor(timeLeft / 60);
            let seconds = timeLeft % 60;

            minutes = minutes < 10 ? '0' + minutes : minutes;
            seconds = seconds < 10 ? '0' + seconds : seconds;

            if (timerElement) {
                timerElement.innerText = `${minutes}:${seconds}`;
            }

            localStorage.setItem('paymentTimer', timeLeft);

            if (timeLeft <= 0) {
                clearInterval(countdownInterval);
                localStorage.removeItem('paymentTimer');
                alert('หมดเวลาโอนเงินภายใน 5 นาที ออเดอร์ของคุณถูกยกเลิกอัตโนมัติ กรุณาสั่งใหม่อีกครั้งค่ะ');
                window.location.href = 'order.html'; 
            }

            timeLeft--;
        }, 1000);
    </script>
</body>
</html>
