<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>ชำระเงิน - Mona Portfolio</title>
    <link rel="stylesheet" href="style.css"> <!-- เช็คชื่อไฟล์ CSS ให้ตรงกัน -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="web-container">
        <header class="navbar">
            <div class="top-controls">
                <button id="themeToggle" class="theme-toggle-btn">
                    <i id="themeIcon" class="fa-solid fa-sun"></i>
                </button>
            </div>
        </header>
        
        <main class="payment-page" style="padding: 20px 0; text-align: center;">
            <div class="qr-box">
                <h2>สแกนเพื่อชำระเงิน</h2>
                <p>ยอดที่ต้องชำระ: <span id="final-amount"></span> บาท</p>
                <img id="qrImage" src="img/my-qr-code-1.jpg" alt="QR Code" class="qr-img">
                <p style="color: red;">*แนบสลิปในหน้าสั่งซื้อแล้ว กดปุ่มด้านล่างเพื่อยืนยัน*</p>
                <div class="form-group">
                    <label>แนบสลิปการโอนเงิน</label>
                    <input type="file" accept="image/*" required>
                </div>
                <br>
                <button type="button" class="btn btn-action-submit" onclick="finishOrder()">สั่งซื้อสำเร็จ</button>
            </div>
        </main>
    </div>

    <!-- เรียกไฟล์เอฟเฟกต์ภายนอก -->
    <script src="js/sparkles.js"></script>

    <!-- โค้ด JavaScript ควบคุมหน้าชำระเงิน -->
   <script>
        // โค้ดดึงยอดเงินจากหน้าสั่งซื้อ
        const savedTotal = sessionStorage.getItem('orderTotal');
        
        if(savedTotal && document.getElementById('final-amount')) {
            document.getElementById('final-amount').innerText = savedTotal;
            
            // แปลงค่าเงินเป็นตัวเลขเพื่อนำมาเช็คเงื่อนไข
            const totalAmount = parseInt(savedTotal);
            const qrImage = document.getElementById('qrImage');

            // เงื่อนไขเปลี่ยน QR Code ตามยอดเงิน
            if (totalAmount === 790) {
                // 1 เล่ม (790 บาท) -> ใช้ QR Code อันที่ 1
                qrImage.src = 'img/my-qr-code-1.jpg'; 
            } else if (totalAmount === 1580) {
                // 2 เล่ม (790 * 2 = 1580 บาท) -> ใช้ QR Code อันที่ 2
                qrImage.src = 'img/my-qr-code-2.jpg';
            } else if (totalAmount === 2370) {
                // 3 เล่ม (790 * 3 = 2370 บาท) -> ใช้ QR Code อันที่ 3
                qrImage.src = 'img/my-qr-code-3.jpg';
            } else {
                // เผื่อกรณีอื่นๆ ให้แสดงรูปแรกเป็นค่าเริ่มต้น
                qrImage.src = 'img/my-qr-code-1.jpg';
            }
        }
        
        function finishOrder() {
            alert('สั่งซื้อสำเร็จ! ขอบคุณที่อุดหนุนนะคะ');
            window.location.href = 'index.html';
        }
        
        document.addEventListener("DOMContentLoaded", function() {
            const themeToggleBtn = document.getElementById('themeToggle');
            const themeIcon = document.getElementById('themeIcon');
            const body = document.body;

            function applyTheme(theme) {
                if (theme === 'dark') {
                    body.classList.add('dark-theme');
                    if(themeIcon) { themeIcon.className = 'fa-solid fa-sun'; themeIcon.style.color = '#f59e0b'; }
                } else {
                    body.classList.remove('dark-theme');
                    if(themeIcon) { themeIcon.className = 'fa-solid fa-moon'; themeIcon.style.color = '#94a3b8'; }
                }
                localStorage.setItem('selectedTheme', theme);
            }

            if(themeToggleBtn) {
                themeToggleBtn.addEventListener('click', function() {
                    const currentTheme = body.classList.contains('dark-theme') ? 'light' : 'dark';
                    applyTheme(currentTheme);
                });
            }
            const savedTheme = localStorage.getItem('selectedTheme') || 'light';
            applyTheme(savedTheme);
        });
    </script>
</body>
</html>
